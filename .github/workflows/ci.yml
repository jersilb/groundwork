# CI — Groundwork. Release-readiness revision (2026-09-12):
#  * build dist/ before every job that boots the local dev server — the Worker
#    serves [assets] from dist/ and refuses to start without it (all five
#    "wrangler dev did not become healthy" failures, CI run 34520003105);
#  * suite wiring: test:prompt-budgets / test:guide-failure-paths /
#    test:llm-timeout (phase 2), test:coach-throttle (phase 6);
#  * npm ci instead of npm install, so lockfile drift fails loudly instead of
#    silently installing a dependency set nobody tested;
#  * phase-5 live test gated by a job-level env var — a step's own env is not
#    visible to its own `if`, and secrets cannot be used in `if` at all.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  vocabulary-lint:
    name: Vocabulary lint (IP firewall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test — prove the lint catches a planted banned term
        run: node scripts/lint-vocabulary.mjs --self-test
      - name: Lint the real repo — must be clean
        run: node scripts/lint-vocabulary.mjs

  build:
    name: Typecheck + local D1 migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # [release-readiness fix] npm ci (not install): a stale lockfile must fail
      # loudly — `npm install` silently installed the package.json pins while
      # the repo had been developed and tested against the locked versions.
      - run: npm ci
      - name: Typecheck (worker + web)
        run: npm run typecheck
      - name: Build the frontend PWA
        run: npm run build:web
      - name: Validate wrangler config (dry-run, separate outdir so it never mixes with the vite dist)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dryrun
      - name: Apply D1 migration locally
        run: npx wrangler d1 migrations apply groundwork --local

  phase1-session-spine:
    name: Phase 1 gate — 3-client no-divergence test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply groundwork --local
      # [release-readiness fix] the dev server serves [assets] from dist/ and
      # refuses to start without it.
      - name: Build the frontend (the local dev server serves dist/)
        run: npm run build:web
      - name: Run the automated multi-client convergence test
        run: node scripts/test-phase1-multiclient.mjs

  session-integration:
    name: Session integration — reconnect/replay, leader override, lab wiring
    runs-on: ubuntu-latest
    # [HOLMES 2026-09-12] The dev server can emit an empty `✘ [ERROR]` and
    # exit on an intermittent transport drop (upstream wrangler ProxyWorker
    # defect — workers-sdk #15203/#15452/#15317); the real stack only exists
    # in wrangler's debug log, so capture it and upload it below.
    env:
      WRANGLER_LOG: debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Infra-flake shield self-test (classification fixtures, no server)
        run: node scripts/test-infra-flake-shield.mjs
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply groundwork --local
      # [release-readiness fix] build before anything that boots the dev server.
      - name: Build the frontend (the local dev server serves dist/)
        run: npm run build:web
      - name: Run the reconnect/replay + leader + lab-wiring test
        run: node scripts/test-session-integration.mjs
      - name: Reopen-completed-lab regression (tight 409 loop — must never 500)
        run: node scripts/test-reopen-regression.mjs
      - name: Session-spine integration smoke (SESSION_SPINE=true, full protocol walk)
        run: node scripts/test-spine-integration.mjs
      - name: Upload wrangler dev logs (intermittent dev-server 500 diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-logs-session-integration
          # [HOLMES v2] wrangler writes its log dir to ~/.wrangler/logs on some
          # setups and ~/.config/.wrangler/logs on Linux CI runners (XDG) — the
          # v1 path only matched the former, so uploads were empty.
          path: |
            ~/.wrangler/logs
            ~/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 7

  phase2-guide-engine:
    name: Phase 2 gate — PACER/EVALUATOR/PROBER + segment spec compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Compile segment specs (proves the loader/compiler works)
        run: npm run specs:compile
      - name: PACER deterministic logic tests
        run: npm run test:pacer
      - name: Guide runtime orchestration tests (PACER tick, evaluate/probe, synthesis contract)
        run: npm run test:guide-runtime
      - name: Demo reference pack rehearsal (six-hour arc resolves + paces correctly)
        run: npm run test:demo-pack
      - name: SessionPlan schema gate (reference plan compiles, malformed plans rejected)
        run: npm run test:session-plan
      - name: Session runtime gate (state machine, clock, break protections, closing gate)
        run: npm run test:session-runtime
      - name: Six-hour deterministic simulation (drift 15/30/60, buffer protection, restart resume)
        run: npm run test:six-hour-simulation
      - name: EVALUATOR/PROBER parsing and validation tests
        run: npm run test:evaluator-prober-parsing
      # [release-readiness fix] hardening suites added on this branch:
      - name: Prompt-budget tests (transcript windows, truncation honesty, determinism)
        run: npm run test:prompt-budgets
      - name: Guide failure-path tests (telemetry, backoff, episode durability, failure notices)
        run: npm run test:guide-failure-paths
      - name: LLM timeout tests (deadline arithmetic, timer cleanup)
        run: npm run test:llm-timeout
      - name: Eval harness (self-test mode — no ANTHROPIC_API_KEY in CI yet)
        run: npm run test:eval-harness

  phase3-resilience:
    name: Phase 3 gate — offline queue, IndexedDB persistence, reconnect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Playwright's Chromium (CI runner, not the dev sandbox)
        run: npx playwright install --with-deps chromium
      # [release-readiness fix] this gate boots the local dev server too, so it
      # needs the same migration + build preamble as every other server gate.
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply groundwork --local
      - name: Build the frontend (the local dev server serves dist/)
        run: npm run build:web
      - name: Run the real-browser network-cutoff/reconnect test
        run: node scripts/test-phase3-resilience.mjs

  phase4-audio-pipeline:
    name: Phase 4 gate — consent, kill switch, R2/D1/Queue, graceful AI failure
    runs-on: ubuntu-latest
    # [HOLMES 2026-09-12] see session-integration job: capture wrangler debug
    # logs for intermittent dev-server transport failures.
    env:
      WRANGLER_LOG: debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply groundwork --local
      # [release-readiness fix] build before booting the dev server.
      - name: Build the frontend (the local dev server serves dist/)
        run: npm run build:web
      - name: Run the audio pipeline test (Workers AI runs remote-only; not exercised here)
        run: node scripts/test-phase4-audio.mjs
      - name: Upload wrangler dev logs (intermittent dev-server 500 diagnosis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-logs-phase4
          # [HOLMES v2] both possible wrangler log dirs (see session job note).
          path: |
            ~/.wrangler/logs
            ~/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 7

  phase5-synthesis:
    name: Phase 5 gate — SYNTHESIZER provenance verification, artifact versioning
    runs-on: ubuntu-latest
    # [release-readiness fix] secrets cannot be referenced in `if:` and a step's
    # own env is not visible to its own `if` — map the secret at job level and
    # test the env var instead (GitHub's documented pattern). While no
    # ANTHROPIC_API_KEY repo secret exists (declined 2026-07-31), the live test
    # self-skips and the deterministic provenance gate below still runs.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply groundwork --local
      # [release-readiness fix] the live test below boots the dev server, so it
      # carries the same dist/ build preamble as every other server gate.
      - name: Build the frontend (the local dev server serves dist/)
        run: npm run build:web
      - name: Provenance verification tests (deterministic, no API key needed)
        run: npm run test:synthesizer-provenance
      - name: Real end-to-end synthesis test (only if ANTHROPIC_API_KEY is configured as a repo secret)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run test:phase5

  phase6-program-layer:
    name: Phase 6 gate — simulated org completes Lab 1, gets a nudge, runs a review
    runs-on: ubuntu-latest
    # [HOLMES 2026-09-12] see session-integration job: capture wrangler debug
    # logs for intermittent dev-server transport failures.
    env:
      WRANGLER_LOG: debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply groundwork --local
      # [release-readiness fix] build before booting the dev server.
      - name: Build the frontend (the local dev server serves dist/)
        run: npm run build:web
      - name: Run the full simulated-org gate test (COACH falls back to templates without a key — still satisfies the gate)
        run: npm run test:phase6
      # [release-readiness fix] hardening suite for the D1-backed COACH throttle.
      - name: COACH nudge throttle tests (persisted throttle, 503 on missing table)
        run: npm run test:coach-throttle
      - name: Upload wrangler dev logs (intermittent dev-server 500 diagnosis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-logs-phase6
          # [HOLMES v2] both possible wrangler log dirs (see session job note).
          path: |
            ~/.wrangler/logs
            ~/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 7

  phase7-commerce-pwa:
    name: Phase 7 gate — Stripe webhook verification, PWA installability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Playwright's Chromium (CI runner, not the dev sandbox)
        run: npx playwright install --with-deps chromium
      - name: Stripe webhook signature verification (pure crypto, no network/key needed)
        run: npm run test:stripe-webhook
      - name: Build the frontend PWA (the installability check serves dist/)
        run: npm run build:web
      - name: PWA installability check via Chrome DevTools Protocol (manifest, service worker, icons)
        run: npm run test:phase7
