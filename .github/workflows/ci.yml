name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  vocabulary-lint:
    name: Vocabulary lint (IP firewall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test — prove the lint catches a planted banned term
        run: node scripts/lint-vocabulary.mjs --self-test
      - name: Lint the real repo — must be clean
        run: node scripts/lint-vocabulary.mjs

  build:
    name: Typecheck + local D1 migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Validate wrangler config
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Apply D1 migration locally
        run: npx wrangler d1 migrations apply groundwork --local

  phase1-session-spine:
    name: Phase 1 gate — 3-client no-divergence test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply groundwork --local
      - name: Run the automated multi-client convergence test
        run: node scripts/test-phase1-multiclient.mjs

  phase2-guide-engine:
    name: Phase 2 gate — PACER/EVALUATOR/PROBER + segment spec compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Compile segment specs (proves the loader/compiler works)
        run: npm run specs:compile
      - name: PACER deterministic logic tests
        run: npm run test:pacer
      - name: EVALUATOR/PROBER parsing and validation tests
        run: npm run test:evaluator-prober-parsing
      - name: Eval harness (self-test mode — no ANTHROPIC_API_KEY in CI yet)
        run: npm run test:eval-harness
