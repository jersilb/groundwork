# Groundwork — Cloudflare Workers configuration.
# Live resources provisioned under Jeremy's account 2026-08-01 (real D1
# database, R2 bucket, Queue — see docs/decisions.md). `wrangler dev
# --local` still emulates these locally for dev/test; `wrangler deploy`
# and `--remote` flags now point at real infrastructure, not placeholders.

name = "groundwork"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# nodejs_compat: the Anthropic SDK's bundle imports node:fs/node:path
# (credential-chain code, unused when constructing the client with an
# explicit apiKey, but esbuild still includes it). Without this flag,
# wrangler warns the Worker "may throw errors at runtime" — found via
# `wrangler deploy --dry-run` on 2026-08-02, fixed before it could bite
# in production rather than after.
compatibility_flags = ["nodejs_compat"]
account_id = "fd5b09ffec9792936392a2fdeddf8590"

[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

[[d1_databases]]
binding = "DB"
database_name = "groundwork"
database_id = "6965f2e7-18e8-4da9-982a-30ffdf4fbf51"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "groundwork-audio"

[[queues.producers]]
binding = "TRANSCRIPTION_QUEUE"
queue = "groundwork-transcription"

[[queues.consumers]]
queue = "groundwork-transcription"
max_batch_size = 10
max_batch_timeout = 5
# Ceiling on the retry loop for transient Whisper failures — an
# unrepairable chunk must reach transcription_error and stop, not spin.
max_retries = 5

# In-session Guide Engine master switch (see Env.GUIDE_ENABLED in
# src/index.ts). Local dev/tests override this to "false" in .dev.vars so
# no suite depends on a live LLM.
[vars]
GUIDE_ENABLED = "true"
# SESSION_SPINE is intentionally NOT set here. Enabling it switches new
# sessions onto the six-hour reference plan + instructor console. Keep it
# off until demo↔spine segment keys are verified aligned (see P0: hyphen
# keys in content/packs/_demo and SPINE_REFERENCE_PLAN). Flip only via an
# explicit env change after that check — never as a silent default.

# Workers AI (Whisper transcription). Real inference always calls out to
# Cloudflare's service, even under `wrangler dev` — there is no local
# emulation for this binding, unlike D1/R2/DO/Queues. See
# docs/capability-gaps.md, 2026-07-27 (this session's sandbox cannot reach
# api.cloudflare.com at all, so this binding is untestable here regardless).
[ai]
binding = "AI"

# Frontend PWA: built by `npm run build:web` (vite) into dist/, served by
# the Worker through this binding. The worker routes API + WebSocket paths
# first, then falls back to static assets with a single-page-app fallback
# to index.html for client-side routes. See src/index.ts.
[assets]
directory = "dist"
binding = "ASSETS"
# SPA: unknown extension-less paths serve index.html with the URL preserved
# (deep links like /org/:id must land on the client route, not redirect to /).
not_found_handling = "single-page-application"
